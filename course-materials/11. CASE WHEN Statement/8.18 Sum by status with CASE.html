<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Sum by status with CASE","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p>The warehouse manager plans the next deliveries per product. For every ordered product, the manager wants the total units, the units delivered and the units still on the way.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Orders: ProductID, OrderStatus, Quantity</p></li><li><p>Sales.Products: ProductID, Product</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Return four columns: Product, TotalUnits, DeliveredUnits, OnTheWayUnits.</p></li><li><p>Show only the products that were ordered at least once.</p></li><li><p>TotalUnits: the sum of Quantity over all orders of the product.</p></li><li><p>DeliveredUnits: the sum of Quantity over the orders with the status 'Delivered'.</p></li><li><p>OnTheWayUnits: the sum of Quantity over the orders with the status 'Shipped'.</p></li><li><p>A product with no units in a column shows 0 there.</p></li><li><p>Sort by Product.</p></li></ul><p><strong>Note:</strong> write the statuses exactly as they are stored. Here, 'delivered' does not match 'Delivered'.</p>","tests":[],"solutions":[{"file_name":"query.sql","content":"SELECT\n    p.Product,\n    SUM(o.Quantity) AS TotalUnits,\n    SUM(\n        CASE\n            WHEN o.OrderStatus = 'Delivered' THEN o.Quantity\n            ELSE 0\n        END\n    ) AS DeliveredUnits,\n    SUM(\n        CASE\n            WHEN o.OrderStatus = 'Shipped' THEN o.Quantity\n            ELSE 0\n        END\n    ) AS OnTheWayUnits\nFROM Sales.Orders AS o\nINNER JOIN Sales.Products AS p\n    ON o.ProductID = p.ProductID\nGROUP BY p.Product\nORDER BY p.Product;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
