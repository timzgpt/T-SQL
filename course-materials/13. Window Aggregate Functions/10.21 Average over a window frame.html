<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Average over a window frame","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p>Finance wants to see if orders get bigger over time in each product category. Single orders jump up and down, so finance wants two smoother numbers next to each order.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Orders: OrderID, ProductID, OrderDate, Sales</p></li><li><p>Sales.Products: ProductID, Category</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Return these columns: Category, OrderID, OrderDate, Sales, AvgSalesSoFar, AvgSalesLast3.</p></li><li><p>Category: the category of the ordered product.</p></li><li><p>Look at each category's orders by OrderDate, from the oldest to the newest.</p></li><li><p>AvgSalesSoFar: the average sales of the category's orders, from its first order up to this one.</p></li><li><p>AvgSalesLast3: the average sales of this order and the 2 orders before it in the same category. The first two orders have fewer orders before them, so use the ones that exist.</p></li><li><p>Round both averages to 2 decimals.</p></li><li><p>Sort by Category, then by OrderDate.</p></li></ul>","tests":[],"solutions":[{"file_name":"query.sql","content":"SELECT\n    p.Category,\n    o.OrderID,\n    o.OrderDate,\n    o.Sales,\n    ROUND(AVG(CAST(o.Sales AS FLOAT)) OVER (PARTITION BY p.Category ORDER BY o.OrderDate), 2) AS AvgSalesSoFar,\n    ROUND(AVG(CAST(o.Sales AS FLOAT)) OVER (\n        PARTITION BY p.Category\n        ORDER BY o.OrderDate\n        ROWS BETWEEN 2 PRECEDING AND CURRENT ROW\n    ), 2) AS AvgSalesLast3\nFROM Sales.Orders AS o\nINNER JOIN Sales.Products AS p\n    ON o.ProductID = p.ProductID\nORDER BY p.Category, o.OrderDate;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
