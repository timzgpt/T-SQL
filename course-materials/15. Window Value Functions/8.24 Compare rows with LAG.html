<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Compare rows with LAG","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p>Customer success wants to see whether customers buy more or fewer items with each new order. For every order, they want the quantity of the customer's previous order and the direction.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Orders: OrderID, CustomerID, OrderDate, Quantity</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Return these columns: CustomerID, OrderID, OrderDate, Quantity, PreviousQuantity, Trend.</p></li><li><p>PreviousQuantity: the quantity of the same customer's order right before this one, by OrderDate. A first order has none, so leave it empty (NULL).</p></li><li><p>Trend: 'First Order' when the customer has no earlier order. Otherwise 'Up' when Quantity is higher than PreviousQuantity, 'Down' when it is lower, and 'Same' when both are equal.</p></li><li><p>Sort by CustomerID, then by OrderDate.</p></li></ul>","tests":[],"solutions":[{"file_name":"query.sql","content":"SELECT\n    CustomerID,\n    OrderID,\n    OrderDate,\n    Quantity,\n    LAG(Quantity) OVER (PARTITION BY CustomerID ORDER BY OrderDate) AS PreviousQuantity,\n    CASE\n        WHEN LAG(Quantity) OVER (PARTITION BY CustomerID ORDER BY OrderDate) IS NULL THEN 'First Order'\n        WHEN Quantity > LAG(Quantity) OVER (PARTITION BY CustomerID ORDER BY OrderDate) THEN 'Up'\n        WHEN Quantity < LAG(Quantity) OVER (PARTITION BY CustomerID ORDER BY OrderDate) THEN 'Down'\n        ELSE 'Same'\n    END AS Trend\nFROM Sales.Orders\nORDER BY CustomerID, OrderDate;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
