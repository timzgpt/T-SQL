<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Combine summaries with CTEs","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p>HR prepares next year's performance reviews. For every employee, HR needs their sales as a salesperson and the number of people who report to them directly.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Employees: EmployeeID, FirstName, ManagerID (the EmployeeID of the employee's manager)</p></li><li><p>Sales.Orders: OrderID, SalesPersonID (the EmployeeID of the salesperson), Sales</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Return EmployeeID, FirstName, TotalSales and DirectReports.</p></li><li><p>TotalSales: the sum of Sales of all orders the employee handled as salesperson.</p></li><li><p>DirectReports: how many employees have this employee as their manager.</p></li><li><p>Show every employee. When there is nothing to add up or count, show 0, not NULL.</p></li><li><p>Sort by EmployeeID.</p></li></ul><p><strong>Note:</strong> ISNULL does not work here, so use COALESCE.</p>","tests":[],"solutions":[{"file_name":"query.sql","content":"WITH CTE_Employee_Sales AS\n(\n    SELECT\n        SalesPersonID,\n        SUM(Sales) AS TotalSales\n    FROM Sales.Orders\n    GROUP BY SalesPersonID\n)\n, CTE_Direct_Reports AS\n(\n    SELECT\n        ManagerID,\n        COUNT(*) AS DirectReports\n    FROM Sales.Employees\n    GROUP BY ManagerID\n)\nSELECT\n    e.EmployeeID,\n    e.FirstName,\n    COALESCE(ces.TotalSales, 0)    AS TotalSales,\n    COALESCE(cdr.DirectReports, 0) AS DirectReports\nFROM Sales.Employees AS e\nLEFT JOIN CTE_Employee_Sales AS ces\n    ON ces.SalesPersonID = e.EmployeeID\nLEFT JOIN CTE_Direct_Reports AS cdr\n    ON cdr.ManagerID = e.EmployeeID\nORDER BY e.EmployeeID;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
