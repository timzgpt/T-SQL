<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Walk a hierarchy with a recursive CTE","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p>Carol Baker (EmployeeID 5) wants a new laptop, and every manager above her must approve it, up to the top. IT builds the approval workflow and needs Carol's chain of approvers.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Employees: EmployeeID, FirstName, Department, ManagerID (the EmployeeID of the employee's manager, NULL for the top manager)</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Return ApprovalStep, EmployeeID, FirstName and Department.</p></li><li><p>One row for each manager above Carol. Carol does not approve her own request.</p></li><li><p>ApprovalStep: 1 for her direct manager, 2 for the manager above that one, and so on.</p></li><li><p>Follow the chain until no manager is left. The company may add levels later, so do not stop after a fixed number of steps.</p></li><li><p>Sort by ApprovalStep.</p></li></ul>","tests":[],"solutions":[{"file_name":"query.sql","content":"WITH CTE_Approval_Chain AS\n(\n    -- Anchor Query: Carol, the employee who asks\n    SELECT\n        EmployeeID,\n        FirstName,\n        Department,\n        ManagerID,\n        0 AS ApprovalStep\n    FROM Sales.Employees\n    WHERE EmployeeID = 5\n    UNION ALL\n    -- Recursive Query: one level up, to the manager of the current row\n    SELECT\n        e.EmployeeID,\n        e.FirstName,\n        e.Department,\n        e.ManagerID,\n        ApprovalStep + 1\n    FROM Sales.Employees AS e\n    INNER JOIN CTE_Approval_Chain AS cac\n        ON e.EmployeeID = cac.ManagerID\n)\nSELECT\n    ApprovalStep,\n    EmployeeID,\n    FirstName,\n    Department\nFROM CTE_Approval_Chain\nWHERE ApprovalStep > 0\nORDER BY ApprovalStep;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
