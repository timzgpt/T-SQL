<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Reuse logic with a view","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p>Three teams calculate the sales per product in different ways, so the head of sales wants one definition in the database. The product team asks first: which products sell less than the average product?</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Products: ProductID, Product, Category</p></li><li><p>Sales.Orders: OrderID, ProductID, Sales</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Create a view named Sales.V_Product_Sales with one row per product: ProductID, Product, Category and TotalSales.</p></li><li><p>TotalSales: the sum of Sales of all the product's orders. A product that never sold has TotalSales 0, because it is still in the catalog.</p></li><li><p>Then answer from the view only. Read the whole view without picking columns, and add GapToAverage as the last column.</p></li><li><p>Keep the products whose TotalSales is below the average TotalSales of all products.</p></li><li><p>GapToAverage: the average TotalSales minus the product's TotalSales.</p></li><li><p>Sort by TotalSales, lowest first.</p></li></ul><p><strong>Note:</strong> write the SELECT right after AS, without parentheses, and no IF OBJECT_ID check. End the CREATE VIEW with a semicolon, not GO. Keep Sales. in the view name, or the view cannot read the Sales tables here. Use COALESCE, not ISNULL.</p>","tests":[],"solutions":[{"file_name":"query.sql","content":"CREATE VIEW Sales.V_Product_Sales AS\nSELECT\n    p.ProductID,\n    p.Product,\n    p.Category,\n    COALESCE(SUM(o.Sales), 0) AS TotalSales\nFROM Sales.Products AS p\nLEFT JOIN Sales.Orders AS o\n    ON o.ProductID = p.ProductID\nGROUP BY\n    p.ProductID,\n    p.Product,\n    p.Category;\n\nSELECT\n    *,\n    (SELECT AVG(TotalSales) FROM Sales.V_Product_Sales) - TotalSales AS GapToAverage\nFROM Sales.V_Product_Sales\nWHERE TotalSales < (SELECT AVG(TotalSales) FROM Sales.V_Product_Sales)\nORDER BY TotalSales;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
