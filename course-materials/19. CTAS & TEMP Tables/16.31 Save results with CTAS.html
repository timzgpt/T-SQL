<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Save results with CTAS","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p>Finance found orders whose sales amount does not match the quantity times the product's list price. The orders keep changing while IT prepares a fix, so the data quality analyst wants the problem orders frozen in their own table.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Orders: OrderID, ProductID, Quantity, Sales</p></li><li><p>Sales.Products: ProductID, Product, Price</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Create a new table named Sales.OrderSalesIssues from a query, with CREATE TABLE ... AS SELECT.</p></li><li><p>The table holds the orders where Sales is not equal to Quantity times Price.</p></li><li><p>Its columns: OrderID, Product, Quantity, Price, Sales and ExpectedSales (Quantity times Price).</p></li><li><p>Then read the new table: return all its columns plus SalesDifference (Sales minus ExpectedSales), sorted by OrderID.</p></li></ul><p><strong>Note:</strong> SELECT ... INTO does not work here. Write no parentheses after AS and no IF OBJECT_ID check, and end each statement with a semicolon, not GO.</p>","tests":[],"solutions":[{"file_name":"query.sql","content":"CREATE TABLE Sales.OrderSalesIssues AS\nSELECT\n    o.OrderID,\n    p.Product,\n    o.Quantity,\n    p.Price,\n    o.Sales,\n    o.Quantity * p.Price AS ExpectedSales\nFROM Sales.Orders AS o\nINNER JOIN Sales.Products AS p\n    ON p.ProductID = o.ProductID\nWHERE o.Sales <> o.Quantity * p.Price;\n\nSELECT\n    *,\n    Sales - ExpectedSales AS SalesDifference\nFROM Sales.OrderSalesIssues\nORDER BY OrderID;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
