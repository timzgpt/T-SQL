<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Sales per salesperson","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p><strong>Friday.</strong> The sales director wants a salesperson report stored in the database, so every team reads the same numbers in Monday's meeting.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Employees: EmployeeID, FirstName, ManagerID (the EmployeeID of the employee's manager, NULL for the top manager)</p></li><li><p>Sales.Orders: OrderID, SalesPersonID (the EmployeeID of the salesperson), Sales</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Create a view named Sales.V_Salesperson_Report with EmployeeID, FirstName, ManagerName, Orders and TotalSales.</p></li><li><p>One row for each employee who handled at least one order as salesperson.</p></li><li><p>ManagerName: the first name of the employee's manager, and 'No manager' for the employee at the top.</p></li><li><p>Orders: the number of orders the employee handled.</p></li><li><p>TotalSales: the sum of their Sales.</p></li><li><p>Then read the whole view without picking columns, and add SalesRank and SharePercent as the last columns.</p></li><li><p>SalesRank: 1 for the highest TotalSales.</p></li><li><p>SharePercent: the employee's share of all sales in the view, in percent, rounded to 1 decimal.</p></li><li><p>Sort by SalesRank.</p></li></ul><p><strong>Note:</strong> write the SELECT right after AS, without parentheses, and no IF OBJECT_ID check. End each statement with a semicolon, not GO, keep Sales. in the view name, and use COALESCE, not ISNULL.</p>","tests":[],"solutions":[{"file_name":"query.sql","content":"CREATE VIEW Sales.V_Salesperson_Report AS\nSELECT\n    e.EmployeeID,\n    e.FirstName,\n    COALESCE(\n        (SELECT m.FirstName FROM Sales.Employees AS m WHERE m.EmployeeID = e.ManagerID),\n        'No manager') AS ManagerName,\n    COUNT(*)     AS Orders,\n    SUM(o.Sales) AS TotalSales\nFROM Sales.Employees AS e\nINNER JOIN Sales.Orders AS o\n    ON o.SalesPersonID = e.EmployeeID\nGROUP BY\n    e.EmployeeID,\n    e.FirstName,\n    e.ManagerID;\n\nSELECT\n    *,\n    RANK() OVER (ORDER BY TotalSales DESC) AS SalesRank,\n    ROUND(CAST(TotalSales AS FLOAT) / SUM(TotalSales) OVER () * 100, 1) AS SharePercent\nFROM Sales.V_Salesperson_Report\nORDER BY SalesRank;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
