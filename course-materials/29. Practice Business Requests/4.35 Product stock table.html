<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Product stock table","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p><strong>Tuesday.</strong> The warehouse wants the stock of every product in its own table, and a refill for the products that run low.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Products: ProductID, Product</p></li><li><p>Sales.Orders: ProductID, Quantity</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Create a table named Sales.ProductStock from a query, with CREATE TABLE ... AS SELECT.</p></li><li><p>Its columns: ProductID, Product, Stock.</p></li><li><p>Stock: 50 minus all ordered units of the product.</p></li><li><p>Then refill your table: every product with 45 units or fewer gets 20 more.</p></li><li><p>Then read the whole table, lowest Stock first, then by ProductID.</p></li></ul><p><strong>Note:</strong> SELECT ... INTO does not work here. Write no parentheses after AS and no IF OBJECT_ID check, and end each statement with a semicolon, not GO.</p>","tests":[],"solutions":[{"file_name":"query.sql","content":"CREATE TABLE Sales.ProductStock AS\nSELECT\n    p.ProductID,\n    p.Product,\n    50 - SUM(o.Quantity) AS Stock\nFROM Sales.Products AS p\nINNER JOIN Sales.Orders AS o\n    ON o.ProductID = p.ProductID\nGROUP BY\n    p.ProductID,\n    p.Product;\n\nUPDATE Sales.ProductStock\nSET Stock = Stock + 20\nWHERE Stock <= 45;\n\nSELECT *\nFROM Sales.ProductStock\nORDER BY Stock, ProductID;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
