<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Average spend per country","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p><strong>Wednesday.</strong> Marketing's spend report says a customer in France spends about 61 on average. Yet Noah, the smallest buyer there, spent 100.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Customers: CustomerID, Country</p></li><li><p>Sales.Orders: OrderID, CustomerID, Sales</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Fix the colleague's query behind the report in the starter, or write a new one below it.</p></li><li><p>Return one row per country: Country, Customers, AvgSpendPerCustomer.</p></li><li><p>Customers: the number of customers in the country.</p></li><li><p>AvgSpendPerCustomer: the average of the customers' total sales in the country, rounded to 2 decimals.</p></li><li><p>Count every customer, also one who never ordered. That customer's total is 0.</p></li><li><p>Sort by Country.</p></li></ul>","tests":[],"solutions":[{"file_name":"query.sql","content":"WITH CTE_CustomerSales AS (\n    SELECT\n        c.CustomerID,\n        c.Country,\n        COALESCE(SUM(o.Sales), 0) AS TotalSales\n    FROM Sales.Customers AS c\n    LEFT JOIN Sales.Orders AS o\n        ON o.CustomerID = c.CustomerID\n    GROUP BY\n        c.CustomerID,\n        c.Country\n)\nSELECT\n    Country,\n    COUNT(*) AS Customers,\n    ROUND(AVG(CAST(TotalSales AS FLOAT)), 2) AS AvgSpendPerCustomer\nFROM CTE_CustomerSales\nGROUP BY Country\nORDER BY Country;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
