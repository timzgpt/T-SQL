<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto, segoe ui, Helvetica, Arial,
          sans-serif, apple color emoji, segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title":"Finance figure check","hasInstructions":false,"hasTests":true,"hasSolutions":true,"instructions":"<p><strong>Thursday.</strong> Finance's report lists the sales per category: Accessories 195, Clothing 285 and Components 300. Finance wants them checked against the orders before the report goes out.</p><p><strong>Tables you can use:</strong></p><ul><li><p>Sales.Orders: OrderID, ProductID, OrderDate, Sales</p></li><li><p>Sales.Products: ProductID, Category</p></li></ul><p><strong>Your task:</strong></p><ul><li><p>Return five columns: Category, DatabaseSales, FinanceSales, Difference, Status.</p></li><li><p>DatabaseSales: the sum of Sales of the category's orders from April and May 2025, the two months the report covers.</p></li><li><p>FinanceSales: the figure from the report.</p></li><li><p>Difference: DatabaseSales minus FinanceSales.</p></li><li><p>Status: 'ok' when the two figures are the same, and 'check' when they are not.</p></li><li><p>Sort by Category.</p></li></ul><p><strong>Note:</strong> MONTH and the other date functions do not work here, so compare OrderDate with a date, like OrderDate &gt;= '2025-01-01'.</p>","tests":[],"solutions":[{"file_name":"query.sql","content":"WITH CTE_Finance AS\n(\n    SELECT 'Accessories' AS Category, 195 AS FinanceSales\n    UNION ALL\n    SELECT 'Clothing', 285\n    UNION ALL\n    SELECT 'Components', 300\n)\n, CTE_Database AS\n(\n    SELECT\n        p.Category,\n        SUM(o.Sales) AS DatabaseSales\n    FROM Sales.Orders AS o\n    INNER JOIN Sales.Products AS p\n        ON p.ProductID = o.ProductID\n    WHERE o.OrderDate BETWEEN '2025-04-01' AND '2025-05-31'\n    GROUP BY p.Category\n)\nSELECT\n    f.Category,\n    d.DatabaseSales,\n    f.FinanceSales,\n    d.DatabaseSales - f.FinanceSales AS Difference,\n    CASE\n        WHEN d.DatabaseSales = f.FinanceSales THEN 'ok'\n        ELSE 'check'\n    END AS Status\nFROM CTE_Finance AS f\nINNER JOIN CTE_Database AS d\n    ON d.Category = f.Category\nORDER BY f.Category;"}]};
      const escapeHTML = s =>
        s.replace(
          /[&<>"]/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
            }[c])
        );

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement('div');
          jsElem.className = className;
          var jsElemTitle = document.createElement('h3');
          jsElemTitle.innerHTML = titlePrefix + ' ' + (i + 1);
          var jsElemBody = document.createElement('code');
          jsElemBody.className = 'code-block black-block';
          jsElemBody.innerHTML = '<pre>' + escapeHTML(elem.content) + '</pre>';
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }

      function main() {
        // display the assignment
        var codingTitle = document.getElementById('coding-title');
        codingTitle.innerHTML = quizData.title;

        var codingInstructions = document.getElementById('coding-instructions');
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = '<span class="italic-text">' + quizData.instructions + '</span>';
        }

        // display the test(s)
        var codingTests = document.getElementById('coding-tests');
        if (!quizData.hasTests) {
          codingTests.innerHTML = '<span class="italic-text">' + quizData.tests + '</span>';
        } else {
          renderCodeList(codingTests, quizData.tests, 'coding-test', 'Test');
        }

        // display the solution(s)
        var codingSolutions = document.getElementById('coding-solutions');
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = '<span class="italic-text">' + quizData.solutions + '</span>';
        } else {
          renderCodeList(codingSolutions, quizData.solutions, 'coding-solution', 'Solution');
        }
      }
    </script>
  </body>
</html>
